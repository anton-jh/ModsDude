name: CI

# Tests run on every push and pull request. A push to main also ships: the API and the client of one
# build are deployed and released together, because each refuses to talk to any other build.
#
# The tests are two jobs rather than one because the solution cannot be built in one place. The
# persistence tests need a real PostgreSQL, and GitHub only runs service containers on Linux runners;
# the WPF client only builds on Windows, and ModsDude.Client.Core's content store is Windows P/Invoke —
# hardlinks and the Recycle Bin — so running its tests anywhere else would prove nothing.
#
# Shipping, in order, each step only after the one before succeeded:
#   1. build-number: N is the count of commits on main, so the same commit is always the same build.
#   2. publish-server: the API's container image, stamped with N, and the migration script for it.
#   3. deploy-server: the API goes first, onto the server described by deploy/compose.yml. A failed
#      migration leaves the running API as it was. There is no rollback past that point: a later failure
#      is fixed by deploying a fixed build.
#   4. release-client: published as release bN, which installed clients update to. A client already
#      released is not released again, so a failed run can simply be re-run.
on:
  push:
  pull_request:

# Runs on main one at a time and never cancelled part way, so builds ship in order.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ship' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the API
        run: dotnet build ModsDude.Server/ModsDude.Server.Api/ModsDude.Server.Api.csproj

      - name: Domain tests
        run: dotnet test ModsDude.Server/ModsDude.Server.Domain.Tests/ModsDude.Server.Domain.Tests.csproj

      # Against pages saved from ModHub, so nothing here reaches the site.
      - name: ModHub parser tests
        run: dotnet test ModsDude.Server/ModsDude.Server.ModHub.Tests/ModsDude.Server.ModHub.Tests.csproj

      # A database of the suite's own, because DatabaseFixture drops and recreates whatever it is
      # pointed at before every run.
      - name: Persistence tests
        env:
          MODSDUDE_TEST_DATABASE: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=modsdude-tests
        run: dotnet test ModsDude.Server/ModsDude.Server.Persistence.Tests/ModsDude.Server.Persistence.Tests.csproj

      # Fails when the server describes something the checked-in document does not — which is the only
      # warning anyone gets that ModsDude.Client.Core's Generated.cs is behind the API. The document is
      # written by the build without starting the API, so this needs no database.
      - name: OpenAPI document is current
        run: pwsh scripts/openapi.ps1

  client:
    name: Client
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The whole solution, which is the only place the WPF project is built at all.
      - name: Build the solution
        run: dotnet build ModsDude.sln

      # Not `dotnet test ModsDude.sln`: that would sweep in the persistence tests, and there is no
      # PostgreSQL on this runner. The server's tests belong to the job that has one.
      - name: Client tests
        run: dotnet test ModsDude.Client/ModsDude.Client.Core.Tests/ModsDude.Client.Core.Tests.csproj --no-build

  build-number:
    name: Build number
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, client]
    runs-on: ubuntu-latest

    outputs:
      number: ${{ steps.count.outputs.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count the commits
        id: count
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # A re-run of an old run would otherwise put an older API in front of clients already on a newer
      # build, and release a client older than the latest.
      - name: Refuse to ship an older build than the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.count.outputs.number }}
        run: |
          latest=$(gh release list --repo "${{ github.repository }}" --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' \
            | sed -n 's/^b\([0-9]\+\)$/\1/p' | sort -n | tail -1)

          if [ -n "$latest" ] && [ "$latest" -gt "$NUMBER" ]; then
            echo "::error::b$NUMBER is older than the latest release, b$latest."
            exit 1
          fi

  publish-server:
    name: Publish the API
    needs: build-number
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The image is written to a file rather than pushed anywhere: deploy-server carries it to the server
      # itself, so there is no registry to sign in to. Based on mcr.microsoft.com/dotnet/aspnet, which runs
      # as a non-root user and listens on 8080.
      - name: Publish the image
        run: >
          dotnet publish ModsDude.Server/ModsDude.Server.Api/ModsDude.Server.Api.csproj
          -c Release
          -r linux-x64
          -t:PublishContainer
          -p:BuildNumber=${{ needs.build-number.outputs.number }}
          -p:ContainerRepository=modsdude-api
          -p:ContainerImageTag=b${{ needs.build-number.outputs.number }}
          -p:ContainerArchiveOutputPath=${{ github.workspace }}/release/modsdude-api.tar

      # Idempotent: wrapped in checks against __EFMigrationsHistory, so applying it twice, or when
      # nothing is pending, is a no-op. Generated here from the exact code being published, rather than
      # applied by the app at startup, so a migration failure is caught before deploy-server touches the
      # running service at all.
      - name: Generate the migration script
        env:
          # Design-time only - this never opens either connection, it only needs both config keys
          # present so the app's startup doesn't fail constructing its DbContext and storage clients.
          ConnectionStrings__Database: Host=localhost;Username=postgres;Password=postgres;Database=designtime
          Storage__StorageAccountName: designtime
        run: |
          # Matches the project's own EF Core version, so the tool never warns about - or breaks on - a
          # mismatch with it.
          version=$(grep -oP 'Include="Microsoft.EntityFrameworkCore" Version="\K[^"]+' ModsDude.Server/ModsDude.Server.Persistence/ModsDude.Server.Persistence.csproj)
          dotnet tool install --global dotnet-ef --version "$version"
          dotnet ef migrations script \
            --idempotent \
            --project ModsDude.Server/ModsDude.Server.Persistence/ModsDude.Server.Persistence.csproj \
            --startup-project ModsDude.Server/ModsDude.Server.Api/ModsDude.Server.Api.csproj \
            --output release/migrate.sql

      - uses: actions/upload-artifact@v4
        with:
          name: server-b${{ needs.build-number.outputs.number }}
          path: release
          if-no-files-found: error

  deploy-server:
    name: Deploy the API
    needs: [build-number, publish-server]
    runs-on: ubuntu-latest

    env:
      BUILD: ${{ needs.build-number.outputs.number }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}

    steps:
      # Checked before anything reaches the server, so a missing one is named rather than surfacing as an
      # ssh failure or an API that never answers.
      - name: Refuse to deploy without the server's settings
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS DEPLOY_SSH_KEY SITE_ADDRESS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. See README.md."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: server-b${{ needs.build-number.outputs.number }}
          path: release

      - name: Set up the deploy key
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Into ~/modsdude, next to the .env with the server's secrets; see README.md.
      - name: Upload the build and the server's configuration
        run: >
          scp -i ~/.ssh/deploy_key -r -C
          deploy/compose.yml deploy/caddy deploy/systemd deploy/deploy.sh deploy/prune-images.sh deploy/backup.sh
          release/modsdude-api.tar release/migrate.sql
          "$DEPLOY_USER@$DEPLOY_HOST:modsdude/"

      - name: Deploy
        run: ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "bash ~/modsdude/deploy.sh $BUILD"

      # Not just any answer: the one that says it is this build.
      - name: Wait for the API to come back up
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 5 "https://$SITE_ADDRESS/health" \
              | jq --exit-status --argjson build "$BUILD" '.build == $build' > /dev/null 2>&1; then
              echo "b$BUILD is up."
              exit 0
            fi
            sleep 2
          done
          echo "::error::b$BUILD is not answering /health."
          exit 1

      - name: Remove old images
        run: ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "bash ~/modsdude/prune-images.sh"

  release-client:
    name: Release the client
    needs: [build-number, deploy-server]
    runs-on: windows-latest

    env:
      BUILD: ${{ needs.build-number.outputs.number }}
      TAG: b${{ needs.build-number.outputs.number }}
      GH_TOKEN: ${{ github.token }}

    permissions:
      contents: write

    steps:
      # Released by an earlier attempt of this run: nothing left to do. A draft is what an attempt that
      # failed part way through uploading leaves, and it is started over.
      - name: Check for an earlier attempt
        id: existing
        shell: pwsh
        run: |
          $release = gh release view $env:TAG --repo "${{ github.repository }}" --json isDraft 2>$null | ConvertFrom-Json

          if ($LASTEXITCODE -ne 0 -or $null -eq $release) {
            "released=false" >> $env:GITHUB_OUTPUT
          }
          elseif ($release.isDraft) {
            gh release delete $env:TAG --repo "${{ github.repository }}" --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not delete the draft left by an earlier attempt." }
            "released=false" >> $env:GITHUB_OUTPUT
          }
          else {
            "released=true" >> $env:GITHUB_OUTPUT
          }

          # gh's exit code for a release that does not exist yet, which is not a failure of this step.
          exit 0

      - uses: actions/checkout@v4
        if: steps.existing.outputs.released == 'false'

      - uses: actions/setup-dotnet@v4
        if: steps.existing.outputs.released == 'false'
        with:
          dotnet-version: 10.0.x

      # The installed app reads the server's address from this file, and the one in the repo's base
      # appsettings.json is the developer's own machine. A release that shipped without it would be an app
      # that cannot reach anything, on every machine that installed it.
      - name: Refuse to ship without the production settings
        if: steps.existing.outputs.released == 'false'
        shell: pwsh
        run: |
          $path = 'ModsDude.Client/ModsDude.Client.Wpf/appsettings.Production.json'

          if (-not (Test-Path $path)) {
            throw "$path is missing. It holds the deployed server's address and has to be committed before a release."
          }

          if ((Get-Content $path -Raw) -match 'localhost|127\.0\.0\.1') {
            throw "$path still points at this machine. A release has to point at the deployed server."
          }

      # Self-contained, so nobody has to install .NET first. Release is the Production install: it files its
      # data under %LocalAppData%\ModsDude and never touches a developer's Development one.
      - name: Publish
        if: steps.existing.outputs.released == 'false'
        run: >
          dotnet publish ModsDude.Client/ModsDude.Client.Wpf/ModsDude.Client.Wpf.csproj
          -c Release -r win-x64 --self-contained
          -p:BuildNumber=${{ env.BUILD }}
          -o publish

      # The same version as the Velopack package the app is built against; a CLI of another version warns
      # about the mismatch and can produce packages the app's updater does not read.
      - name: Install the Velopack CLI
        if: steps.existing.outputs.released == 'false'
        shell: pwsh
        run: |
          $csproj = Get-Content ModsDude.Client/ModsDude.Client.Wpf/ModsDude.Client.Wpf.csproj -Raw
          $version = [regex]::Match($csproj, 'Include="Velopack" Version="([^"]+)"').Groups[1].Value
          dotnet tool install -g vpk --version $version

      # Earlier releases, so the new one is packed as a small delta on top of them instead of every update
      # being the whole app. Nothing to download for the first release, which is not an error.
      - name: Fetch earlier releases
        if: steps.existing.outputs.released == 'false'
        shell: pwsh
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }}

      # packId is not the data folder's name on purpose. Velopack installs to %LocalAppData%\<packId> and an
      # uninstall deletes that folder, and the app's own data is in %LocalAppData%\ModsDude.
      # --aumid is the app's own identity (AppIdentity.Name), so the installer's shortcuts and the running
      # process agree on who they are and Windows shows the app's notifications.
      # The package version is 0.0.N; see Directory.Build.props.
      - name: Pack
        if: steps.existing.outputs.released == 'false'
        run: >
          vpk pack
          --packId ModsDude.Client
          --packVersion 0.0.${{ env.BUILD }}
          --packDir publish
          --mainExe ModsDude.Client.Wpf.exe
          --packTitle ModsDude
          --packAuthors ${{ github.repository_owner }}
          --icon ModsDude.Client/ModsDude.Client.Wpf/Assets/AppIcon.ico
          --aumid ModsDude
          --shortcuts Desktop,StartMenuRoot

      # Tagged on the commit that was built rather than wherever main is by now. The API's GET /download
      # links to this release's installer by its tag.
      - name: Publish the release
        if: steps.existing.outputs.released == 'false'
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ github.token }}
          --tag ${{ env.TAG }}
          --targetCommitish ${{ github.sha }}
          --releaseName "ModsDude ${{ env.TAG }}"
          --publish
