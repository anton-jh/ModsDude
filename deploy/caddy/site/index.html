<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModsDude</title>
<style>
	:root {
		color-scheme: dark;
	}

	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		background: #121212;
		color: #e8e8e8;
		font-family: system-ui, -apple-system, Segoe UI, sans-serif;
	}

	main {
		max-width: 28rem;
		padding: 2rem;
		text-align: center;
	}

	h1 {
		margin: 0 0 0.5rem;
		font-size: 2rem;
	}

	p.tagline {
		margin: 0 0 2rem;
		color: #a0a0a0;
	}

	a.download {
		display: inline-block;
		padding: 0.75rem 2rem;
		background: #4f7cff;
		color: #fff;
		text-decoration: none;
		border-radius: 0.375rem;
		font-weight: 600;
	}

	a.download:hover {
		background: #3a65e0;
	}

	.notice {
		margin-top: 2rem;
		padding: 0.75rem 1rem;
		border: 1px solid #3a3a3a;
		border-radius: 0.375rem;
		background: #1c1c1c;
		color: #a0a0a0;
		font-size: 0.875rem;
	}
</style>
</head>
<body>
<main>
	<h1>ModsDude</h1>
	<p class="tagline">The Dude of Mods.</p>
	<a class="download" href="/download">Download</a>
	<div class="notice">ModsDude is not intended for public use.<br>A personal invitation is needed to use it.</div>
</main>
</body>
</html>
