# The whole server: the API, its database and the reverse proxy in front of it. Lives in ~/modsdude on the
# server next to .env (see .env.example) and is uploaded fresh by every deploy; see the repository's README.md.
#
# Only Caddy publishes ports to the internet. Docker opens published ports past ufw, so anything else
# listed here with ports would be on the internet whatever the firewall says - unless, like the API's
# admin port, it is published on 127.0.0.1 only.
#
# The images are pinned to exact versions, so nothing changes under the server without a commit. Newer
# ones are taken by changing the tag here and shipping.

name: modsdude

x-logging: &logging
  # Docker keeps every line otherwise, until the disk is full.
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    # The Debian release in the tag matters as much as the version: another one can sort text
    # differently, which corrupts the indexes of a database created under the old one.
    image: postgres:17.11-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: modsdude
      POSTGRES_DB: modsdude
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "modsdude", "--dbname", "modsdude"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  # Loaded by deploy.sh from the image CI built, never pulled: there is no registry, and a modsdude-api on
  # Docker Hub would be somebody else's.
  api:
    image: modsdude-api:current
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Database: Host=db;Port=5432;Username=modsdude;Password=${POSTGRES_PASSWORD:?};Database=modsdude
      Storage__StorageAccountName: ${STORAGE_ACCOUNT_NAME:?}
      Backups__StorageAccountName: ${BACKUP_STORAGE_ACCOUNT_NAME:?}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:?}
      Admin__Password: ${ADMIN_PASSWORD:?}
      Admin__Port: 8081
      # 8080 for Caddy; 8081 for the admin pages, which answer on nothing else.
      ASPNETCORE_HTTP_PORTS: "8080;8081"
      Deploy__Token: ${DEPLOY_TOKEN:?}
    # Only on the server's own loopback. Tailscale serves it to the operator's devices; see README.md.
    ports:
      - "127.0.0.1:8081:8081"
    logging: *logging

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # The folder rather than the file: a mounted file keeps showing the old content once it is
      # replaced, a mounted folder shows the new one.
      - ./caddy:/etc/caddy:ro
      # The certificates. Losing them means asking Let's Encrypt again, which rate-limits.
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  db:
  caddy-data:
  caddy-config:
